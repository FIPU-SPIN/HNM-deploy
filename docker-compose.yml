services:
  mongo:
    image: mongo:8
    container_name: accent-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: accent-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/Naglasci
      JWT_SECRET: moja_super_tajna_jwt_vrijednost_123
      PORT: 5000
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: accent-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data: